<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
    <title>Tailwind + AlpineJS Hello World</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body class="flex h-screen items-center justify-center bg-gray-100">
    <div x-data="{ message: 'Hello world!' }" class="p-8 bg-white rounded shadow text-center">
      <h1 class="text-3xl font-bold text-blue-600 mb-4" x-text="message"></h1>
      <button 
        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition"
        @click="message = 'Hello from AlpineJS!'"
      >
        Change Message
      </button>
    </div>
  </body>
</html>
